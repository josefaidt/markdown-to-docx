name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Bump version
        id: bump
        run: |
          TAG=$(bun x --bun npm version ${{ github.event.inputs.bump }} --message "release: %s")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Stamp README
        run: |
          TAG="${{ steps.bump.outputs.tag }}"
          VERSION="${TAG#v}"
          USAGE=$(bun run bin/markdown-to-docx.ts --help 2>&1 || true)
          perl -i -0pe "s|<!-- BEGIN USAGE -->.*<!-- END USAGE -->|<!-- BEGIN USAGE -->\n\n\`\`\`console\n${USAGE}\n\`\`\`\n\n<!-- END USAGE -->|s" README.md
          sed -i "s|\"ref\": \".*\"|\"ref\": \"${TAG}\"|g" README.md
          sed -i "s|<!-- LATEST_TAG: .* -->|<!-- LATEST_TAG: ${TAG} -->|" README.md
          git add README.md
          git commit --amend --no-edit
          git tag -f "$TAG"
      - name: Push
        run: |
          git push origin HEAD:main
          git push origin "${{ steps.bump.outputs.tag }}"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.bump.outputs.tag }}" \
            --generate-notes \
            --draft \
            scripts/install.sh

  build:
    name: Build (${{ matrix.target }})
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            artifact: markdown-to-docx-linux-x64
          - target: bun-linux-arm64
            artifact: markdown-to-docx-linux-arm64
          - target: bun-darwin-x64
            artifact: markdown-to-docx-darwin-x64
          - target: bun-darwin-arm64
            artifact: markdown-to-docx-darwin-arm64
          - target: bun-windows-x64
            artifact: markdown-to-docx-windows-x64.exe
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: ./.github/actions/setup
        with:
          # bun 1.3.12 produces broken darwin binaries when cross-compiled from Linux
          bun-version: 1.3.11
      - name: Build
        run: bun build --compile --target=${{ matrix.target }} --outfile=${{ matrix.artifact }} bin/markdown-to-docx.ts
      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "${{ matrix.artifact }}" --repo "${{ github.repository }}"

  smoke-test:
    name: Smoke test (${{ matrix.artifact }})
    needs: [release, build]
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - artifact: markdown-to-docx-linux-x64
            runner: ubuntu-latest
          - artifact: markdown-to-docx-darwin-arm64
            runner: macos-latest
          - artifact: markdown-to-docx-darwin-x64
            runner: macos-latest
          - artifact: markdown-to-docx-windows-x64.exe
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ needs.release.outputs.tag }}" --pattern "${{ matrix.artifact }}" --repo "${{ github.repository }}"
      - name: Smoke test (unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x "${{ matrix.artifact }}"
          ./"${{ matrix.artifact }}" --help
          ./"${{ matrix.artifact }}" --version
      - name: Smoke test (windows)
        if: runner.os == 'Windows'
        run: |
          .\${{ matrix.artifact }} --help
          .\${{ matrix.artifact }} --version

  publish:
    name: Publish release
    needs: [release, build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote draft to published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ needs.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false

  checksums:
    name: Checksums
    needs: [release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      darwin-arm64: ${{ steps.sha.outputs.darwin-arm64 }}
      darwin-x64: ${{ steps.sha.outputs.darwin-x64 }}
      linux-arm64: ${{ steps.sha.outputs.linux-arm64 }}
      linux-x64: ${{ steps.sha.outputs.linux-x64 }}
    steps:
      - name: Download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ needs.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "markdown-to-docx-*"
      - name: Generate and publish checksums
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum markdown-to-docx-* > checksums.txt
          gh release upload "${{ needs.release.outputs.tag }}" checksums.txt \
            --repo "${{ github.repository }}" --clobber
          # Expose each binary's SHA256 as a job output for the tap update
          for suffix in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            sha=$(sha256sum "markdown-to-docx-${suffix}" | cut -d' ' -f1)
            echo "${suffix}=${sha}" >> "$GITHUB_OUTPUT"
          done

  update-tap:
    name: Update Homebrew tap
    needs: [release, checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source (for formula template)
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Check out tap
        uses: actions/checkout@v6
        with:
          repository: josefaidt/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Render formula
        env:
          TAG: ${{ needs.release.outputs.tag }}
          SHA_DARWIN_ARM64: ${{ needs.checksums.outputs.darwin-arm64 }}
          SHA_DARWIN_X64: ${{ needs.checksums.outputs.darwin-x64 }}
          SHA_LINUX_ARM64: ${{ needs.checksums.outputs.linux-arm64 }}
          SHA_LINUX_X64: ${{ needs.checksums.outputs.linux-x64 }}
        run: |
          mkdir -p tap/Formula
          sed \
            -e "s|@@TAG@@|${TAG}|g" \
            -e "s|@@SHA_DARWIN_ARM64@@|${SHA_DARWIN_ARM64}|g" \
            -e "s|@@SHA_DARWIN_X64@@|${SHA_DARWIN_X64}|g" \
            -e "s|@@SHA_LINUX_ARM64@@|${SHA_LINUX_ARM64}|g" \
            -e "s|@@SHA_LINUX_X64@@|${SHA_LINUX_X64}|g" \
            .github/homebrew/markdown-to-docx.rb.tmpl > tap/Formula/markdown-to-docx.rb
      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/markdown-to-docx.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git commit -m "markdown-to-docx ${{ needs.release.outputs.tag }}"
          git push

  cleanup:
    name: Cleanup failed release
    needs: [release, build, smoke-test]
    if: always() && failure() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Revert version bump
        run: |
          git revert HEAD --no-edit
          git push origin HEAD:main
      - name: Delete tag
        run: |
          git push origin --delete "${{ needs.release.outputs.tag }}" || true
      - name: Delete draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ needs.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --yes || true
